<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta name="description" content="输入一个汉字，选择简体或繁体、圆框或方框，制作并下载透明背景的 PNG 和 SVG 图标。" />
    <title>字成图 · 汉字图标生成器</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./assets/vendor/opentype-1.3.4.min.js"></script>
    <script defer src="./assets/vendor/opencc-1.4.2.js"></script>
    <script defer src="./assets/vendor/fflate-0.8.2.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="字成图首页">
          <span class="brand-mark" aria-hidden="true">字</span>
          <span class="brand-name">字成图<span class="brand-caption">HANZI ICON STUDIO</span></span>
        </a>
        <span class="header-note"><span aria-hidden="true"></span>一个汉字，也是一枚图标</span>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">简单成形，自有字趣</p>
          <h1 id="page-title">把一个字，<span>装进图标。</span></h1>
          <p class="intro-description">输入汉字，选择外框，下载属于你的汉字图标。</p>
        </section>

        <div class="workspace">
          <section class="settings-panel" aria-label="图标设置">
            <div class="setting-group character-group">
              <label class="field-label" for="character"><span class="step-number">01</span>输入汉字</label>
              <div class="character-input-wrap">
                <input id="character" type="text" value="汉" placeholder="字" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="input-hint" />
                <span class="character-count" id="character-count" aria-hidden="true">1 个字</span>
              </div>
              <p class="field-hint" id="input-hint">支持汉字、数字、字母和常见符号</p>
              <div class="sample-row" aria-label="试试这些汉字">
                <span>试试</span>
                <button type="button" data-character="山" aria-label="使用汉字山">山</button>
                <button type="button" data-character="木" aria-label="使用汉字木">木</button>
                <button type="button" data-character="雨" aria-label="使用汉字雨">雨</button>
                <button type="button" data-character="永" aria-label="使用汉字永">永</button>
                <button type="button" data-character="汉" aria-label="使用汉字汉">汉</button>
              </div>
            </div>

            <fieldset class="setting-group script-group">
              <legend class="field-label"><span class="step-number">02</span>选择简繁</legend>
              <div class="segmented-control">
                <label class="segment"><input type="radio" name="script" value="simplified" checked /><span>简体汉字</span></label>
                <label class="segment"><input type="radio" name="script" value="traditional" /><span>繁體漢字</span></label>
              </div>
              <p class="conversion-note" id="conversion-note">保留简体字形</p>
              <p class="variant-note" id="variant-note" aria-hidden="true">简繁单字可能有多个对应，你也可以直接输入需要的繁体字。</p>
            </fieldset>

            <fieldset class="setting-group shape-group">
              <legend class="field-label"><span class="step-number">03</span>选择外框</legend>
              <div class="shape-options">
                <label class="shape-option">
                  <input type="radio" name="shape" value="circle" checked />
                  <span class="shape-option-content"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="16" /></svg><span>圆形</span><span class="selection-dot" aria-hidden="true"></span></span>
                </label>
                <label class="shape-option">
                  <input type="radio" name="shape" value="square" />
                  <span class="shape-option-content"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="4" y="4" width="32" height="32" rx="1" /></svg><span>方形</span><span class="selection-dot" aria-hidden="true"></span></span>
                </label>
              </div>
            </fieldset>
            <p class="settings-footnote"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3.5" y="7" width="9" height="7" rx="1.5" /><path d="M5.5 7V4.5a2.5 2.5 0 0 1 5 0V7" /></svg>在你的浏览器里生成</p>
          </section>

          <section class="preview-panel" aria-labelledby="preview-title">
            <div class="preview-header">
              <h2 id="preview-title">图标预览<span>LIVE PREVIEW</span></h2>
              <span class="background-badge"><span aria-hidden="true"></span>透明背景</span>
            </div>
            <div class="preview-stage" id="preview-stage" aria-busy="true">
              <div class="preview-mount" id="preview-mount"></div>
              <div class="preview-placeholder" id="preview-placeholder"><span class="placeholder-mark" aria-hidden="true">字</span><p id="preview-message">正在准备字体…</p><button class="retry-button" id="retry-font" type="button" hidden>重新加载</button></div>
            </div>
            <div class="preview-details">
              <div class="size-previews" aria-label="图标小尺寸预览">
                <div class="size-preview"><div class="mini-icon mini-32" id="mini-32" aria-hidden="true"></div><span>32 px</span></div>
                <div class="size-preview"><div class="mini-icon mini-48" id="mini-48" aria-hidden="true"></div><span>48 px</span></div>
                <div class="size-preview"><div class="mini-icon mini-64" id="mini-64" aria-hidden="true"></div><span>64 px</span></div>
              </div>
              <div class="preview-caption"><span class="output-character" id="output-character">汉</span><span id="output-description">简体 · 圆形</span><span class="font-caption">思源黑体</span></div>
            </div>
            <div class="export-section">
              <div class="export-actions">
                <button class="download-button primary" id="download-png" type="button" disabled><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3v9m-3-3 3 3 3-3M4 13v3h12v-3" /></svg><span>下载 PNG</span></button>
                <div class="svg-download" id="svg-download">
                  <button class="download-button secondary" id="download-svg" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="svg-size-menu" disabled><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3v9m-3-3 3 3 3-3M4 13v3h12v-3" /></svg><span>下载 SVG</span><svg class="menu-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg></button>
                  <div class="svg-size-menu" id="svg-size-menu" role="menu" aria-label="选择 SVG 下载尺寸" hidden>
                    <p class="menu-heading" role="presentation">选择尺寸</p>
                    <button type="button" role="menuitem" tabindex="-1" data-svg-size="32"><span>32 × 32</span><span class="size-description">SVG</span></button>
                    <button type="button" role="menuitem" tabindex="-1" data-svg-size="64"><span>64 × 64</span><span class="size-description">SVG</span></button>
                    <button type="button" role="menuitem" tabindex="-1" data-svg-size="128"><span>128 × 128</span><span class="size-description">SVG</span></button>
                    <button type="button" role="menuitem" tabindex="-1" data-svg-size="256"><span>256 × 256</span><span class="size-description">SVG</span></button>
                    <button type="button" role="menuitem" tabindex="-1" data-svg-size="512"><span>512 × 512</span><span class="size-description">SVG</span></button>
                    <button class="download-all" type="button" role="menuitem" tabindex="-1" data-svg-size="all"><span>全部下载</span><span class="size-description">5 个 SVG · ZIP</span></button>
                  </div>
                </div>
              </div>
              <div class="export-notes"><span>512 × 512 像素</span><span>可选尺寸，支持全部下载</span></div>
            </div>
          </section>
        </div>
        <p class="status-line" id="status" role="status" aria-live="polite"></p>
        <noscript><p class="noscript-message">请启用 JavaScript，以生成和下载汉字图标。</p></noscript>
      </main>

      <footer class="site-footer"><span>一字一形，刚刚好。</span><span>字成图 <span class="footer-dot">·</span> 轻巧的汉字图标工具</span></footer>
    </div>
  </body>
</html>
